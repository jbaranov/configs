
[bell]
animation = "EaseOutExpo"
color = "0xffffff"
duration = 0

[colors]
draw_bold_text_with_bright_colors = false


[cursor]
style = "Block"
unfocused_hollow = true

[debug]
log_level = "OFF"
persistent_logging = true
print_events = false
render_timer = false

[font]
size = 14.0

[font.bold]
family = "IosevkaTerm Nerd Font"
style = "Medium"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
family = "IosevkaTerm Nerd Font"
style = "Light Italic"

[font.normal]
family = "IosevkaTerm Nerd Font"
style = "Light"

[font.offset]
x = 0
y = 0

[mouse]
hide_when_typing = false

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 0
multiplier = 3

[selection]
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[terminal.shell]
args = ["-l", "-c", "tmux attach || tmux new -s main"]
program = "/opt/homebrew/bin/fish"

[window]
decorations = "none"
dynamic_padding = true
startup_mode = "SimpleFullscreen"

[window.padding]
x = 10
y = 25

[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/themes/tomorrow_night.toml"]

[terminal]
